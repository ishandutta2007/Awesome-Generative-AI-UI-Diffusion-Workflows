<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="50%" stop-color="#12131f" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="orb1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb2" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb3" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .grid-layer { fill: url(#grid); }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .gradient-text {
      fill: url(#primary-grad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .pill-bg {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 1;
      rx: 16;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    
    /* Dynamic pulsing animations in background */
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 1; }
    }
    @keyframes pulse-fast {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      50% { transform: scale(1.2) translate(25px, -20px); opacity: 0.9; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .pulse-orb-1 { animation: pulse-slow 8s ease-in-out infinite; transform-origin: 250px 150px; }
    .pulse-orb-2 { animation: pulse-fast 10s ease-in-out infinite; transform-origin: 950px 250px; }
    .workflow-line {
      stroke-dasharray: 6, 6;
      animation: dash 2.5s linear infinite;
    }
    .floating-box {
      animation: float-node 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" class="bg" />
  <rect width="1200" height="420" class="grid-layer" />

  <!-- Animated Glowing Orbs (In background behind text) -->
  <circle cx="250" cy="140" r="220" fill="url(#orb1)" class="pulse-orb-1" />
  <circle cx="960" cy="260" r="240" fill="url(#orb2)" class="pulse-orb-2" />
  <circle cx="600" cy="360" r="180" fill="url(#orb3)" class="pulse-orb-1" />

  <!-- Dynamic Workflow Node Graph in Background -->
  <g opacity="0.45" class="floating-box">
    <!-- Connecting workflow wires -->
    <path d="M 820 80 C 890 80, 880 160, 960 160" fill="none" stroke="#8b5cf6" stroke-width="2" class="workflow-line" />
    <path d="M 960 160 C 1040 160, 1020 90, 1100 90" fill="none" stroke="#ec4899" stroke-width="2" class="workflow-line" />
    <path d="M 960 160 C 1030 160, 1020 250, 1090 250" fill="none" stroke="#06b6d4" stroke-width="2" class="workflow-line" />

    <!-- Node 1: Checkpoint Loader -->
    <rect x="730" y="55" width="110" height="50" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="745" cy="70" r="4" fill="#a5b4fc" />
    <text x="758" y="74" fill="#e0e7ff" font-family="sans-serif" font-size="11" font-weight="700">Checkpoint</text>
    <text x="745" y="93" fill="#818cf8" font-family="sans-serif" font-size="9">FLUX / SDXL</text>

    <!-- Node 2: KSampler / Node Graph -->
    <rect x="910" y="135" width="115" height="55" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" filter="url(#glow)" />
    <circle cx="925" cy="153" r="4" fill="#f0abfc" />
    <text x="938" y="157" fill="#fae8ff" font-family="sans-serif" font-size="11" font-weight="700">KSampler</text>
    <text x="925" y="176" fill="#d8b4fe" font-family="sans-serif" font-size="9">Euler / 25 Steps</text>

    <!-- Node 3: Real-Time Canvas -->
    <rect x="1050" y="65" width="110" height="50" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <circle cx="1065" cy="80" r="4" fill="#7dd3fc" />
    <text x="1078" y="84" fill="#f0f9ff" font-family="sans-serif" font-size="11" font-weight="700">Latent Canvas</text>
    <text x="1065" y="103" fill="#38bdf8" font-family="sans-serif" font-size="9">Live Drawing</text>

    <!-- Node 4: VAE Decode Output -->
    <rect x="1050" y="225" width="110" height="50" rx="8" fill="#1f1235" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="1065" cy="240" r="4" fill="#f472b6" />
    <text x="1078" y="244" fill="#fdf2f8" font-family="sans-serif" font-size="11" font-weight="700">Save Image</text>
    <text x="1065" y="263" fill="#f472b6" font-family="sans-serif" font-size="9">4K Resolution</text>
  </g>

  <!-- Decorative Corner Accents -->
  <line x1="80" y1="50" x2="200" y2="50" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
  <line x1="80" y1="50" x2="80" y2="120" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />

  <!-- FOREGROUND CONTENT: Guaranteed high contrast & clear readability -->
  <g transform="translate(80, 0)">
    <!-- Tagline Badge -->
    <rect x="0" y="90" width="310" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="15" cy="104" r="5" fill="#38bdf8" />
    <text x="28" y="109" class="tagline">CURATED KNOWLEDGE GRAPH 2026</text>

    <!-- Main Title -->
    <text x="0" y="170" class="title">Awesome Generative AI UI</text>
    <text x="0" y="222" class="title">&amp; <tspan class="gradient-text">Diffusion Workflows</tspan></text>

    <!-- Subtitle -->
    <text x="0" y="270" class="subtitle">ComfyUI Nodes, Real-Time Canvas, Local WebUIs &amp; Serverless GPU Workflows</text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 312)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" class="pill-bg" />
        <text x="18" y="22" class="pill-text">⚡ ComfyUI Nodes</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(155, 0)">
        <rect width="145" height="34" class="pill-bg" />
        <text x="18" y="22" class="pill-text">🎨 Real-Time Canvas</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(310, 0)">
        <rect width="135" height="34" class="pill-bg" />
        <text x="18" y="22" class="pill-text">🖥️ Local WebUIs</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(455, 0)">
        <rect width="155" height="34" class="pill-bg" />
        <text x="18" y="22" class="pill-text">🚀 Serverless APIs</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(620, 0)">
        <rect width="125" height="34" class="pill-bg" />
        <text x="18" y="22" class="pill-text">💫 Open Source</text>
      </g>
    </g>
  </g>
</svg>
